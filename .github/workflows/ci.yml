# Netz unter der Portierung (Roadmap Phase 1).
#
# Zwei Läufe, mit unterschiedlichem Zweck:
#
#   windows  — alles: Solution bauen, beide Testprojekte laufen lassen. Das ist der
#              vollständige Lauf, denn nur hier existiert der WPF-Kopf.
#   ubuntu   — GonkNote.Core, GonkNote.ViewModels, GonkNote.Legacy, **GonkNote.Avalonia**
#              und die Core-Tests. War bis Phase 2 ein Frühwarnsystem gegen versehentliche
#              WPF-Abhängigkeiten; seit Phase 3 baut hier der Linux-Kopf selbst mit, und der
#              Lauf sichert damit nicht mehr nur Meilenstein M0, sondern den Weg zu M1.
#
# GonkNote.Wpf lässt sich unter Linux **nicht** bauen (net10.0-windows10.0.19041.0). Das ist
# so gewollt und kein Fehler; deshalb wird dort projektbezogen gebaut und nicht die Solution.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Ein neuer Push bricht den noch laufenden Lauf desselben Branches ab — sonst stehen mehrere
# Läufe in der Warteschlange und der letzte, der zählt, kommt zuletzt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Zu den Action-Hauptversionen: die jeweils neueste, weil erst diese auf **Node 24** laufen.
# Die Fassungen `checkout@v4` / `setup-dotnet@v4` / `upload-artifact@v4` zielen noch auf
# Node 20; GitHub zwingt sie schon heute auf Node 24 und meldet das als Deprecation an jedem
# Lauf. Wenn die Unterstützung endet, wird daraus ein Fehler — deshalb gleich anheben.
# Geprüft: die hier benutzten Eingaben (dotnet-version, name, path, if-no-files-found,
# retention-days) heißen unverändert.

jobs:
  windows:
    name: Windows (alles)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # Absichtlich das Band und keine feste Fassung: das Projekt steht auf net10.0 (LTS),
          # ein Patch-Update des SDK soll die CI nicht anhalten.
          dotnet-version: '10.0.x'

      # Bewusst **ohne** getrennten `dotnet restore` und ohne `--no-restore`: der WPF-Kopf
      # setzt in Release `RuntimeIdentifier=win-x64` (self-contained). Ein Restore ohne
      # `-c Release` legt dafür kein Ziel an, und der Build bricht mit NETSDK1047 ab. Der
      # Build stellt selbst wieder her und kennt die Konfiguration dabei.
      - name: Bauen (Release)
        # -warnaserror hält die Regel „0 Fehler, 0 Warnungen" fest. Ohne das wäre sie eine
        # Absichtserklärung, an die sich nach dem zehnten grünen Lauf niemand mehr hält.
        run: dotnet build GonkNote.slnx -c Release -warnaserror

      # `tee` statt eines blossen Aufrufs, damit der naechste Schritt das Protokoll noch
      # hat; `pipefail`, weil sonst der Rueckgabewert von `tee` zaehlt und ein
      # fehlgeschlagener Testlauf als Erfolg durchginge.
      - name: Testen
        shell: bash
        run: |
          set -o pipefail
          dotnet test GonkNote.slnx -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee test-output.txt

      # ------------------------------------------------------------------
      # Warum dieser Schritt existiert (§4.101, V2-125):
      #
      # Die CI war vier Tage lang rot, und **von außen war nicht zu erkennen, WAS fiel**.
      # Die Protokolle eines Laufs verlangen `admin`-Rechte am Repo
      # (`HTTP 403: Must have admin rights to Repository`) -- das gilt für den Lauf UND für
      # den einzelnen Job, und es gilt auch bei einem öffentlichen Repo. Wer nicht am Konto
      # sitzt, sieht nur „failure".
      #
      # `::error::` erzeugt dagegen eine **Annotation**, und die steht in der Check-Run-API,
      # die bei einem öffentlichen Repo **ohne Anmeldung** lesbar ist:
      #     /repos/:o/:r/check-runs/:id/annotations
      # Damit ist der Name des gefallenen Wächters von überall zu holen, ohne Zugangsdaten.
      #
      # ⚠ GitHub zeigt je Schritt **höchstens zehn** Fehler-Annotationen -- deshalb `head`.
      #   Die vollständige Liste geht zusätzlich in die Job-Zusammenfassung.
      # ------------------------------------------------------------------
      - name: Gefallene Waechter benennen
        if: failure()
        shell: bash
        run: |
          if [ ! -f test-output.txt ]; then
            echo "::error::Kein Testprotokoll -- der Lauf ist vor dem Testschritt gescheitert."
            exit 0
          fi

          # xUnit schreibt "[FAIL]", VSTest schreibt "  Failed <Name> [12 ms]".
          # Beide Formen einsammeln, damit die Zeile nicht an einer Werkzeugfassung haengt.
          grep -E '\[FAIL\]|^[[:space:]]*(Failed|Fehler)[[:space:]]+[A-Za-z]' test-output.txt \
            | sed 's/^[[:space:]]*//' | sort -u > gefallen.txt || true

          {
            echo "### Gefallene Waechter"
            echo ''
            echo '```'
            cat gefallen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Die letzten Zeilen sagen, wie viele es waren -- ohne sie liest man zehn Namen
          # und weiss nicht, ob es zehn oder hundert sind.
          grep -E 'Failed!|Passed!|Bestanden!|Fehlgeschlagen!' test-output.txt | tail -3 \
            | while IFS= read -r zeile; do echo "::error::$zeile"; done

          head -10 gefallen.txt | while IFS= read -r zeile; do echo "::error::$zeile"; done

      # Bei einem Fehlschlag sind die erzeugten Dateien das Einzige, was weiterhilft: das
      # tatsächlich gezeichnete Bild eines abgewichenen Snapshots und der vollständige Text
      # eines abgewichenen Golden-Files. Ohne sie bleibt nur ein Hash-Unterschied.
      - name: Beweisstücke einsammeln
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: abweichungen-windows
          path: |
            tests/GonkNote.Core.Tests/bin/Release/**/Snapshots/ist/**
            tests/GonkNote.Wpf.Tests/bin/Release/**/Fixtures/ist/**
          if-no-files-found: ignore
          retention-days: 14

  linux:
    name: Linux (nur Core, Fruehwarnsystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Zum **Bauen** von Core genügt das SkiaSharp-Paket. Zum **Ausführen** nicht: die
      # native Bibliothek für Linux kommt aus SkiaSharp.NativeAssets.Linux (siehe
      # Directory.Packages.props), und die verlangt fontconfig. Ohne mindestens eine
      # installierte Schrift liefert SKTypeface.Default eine leere Schrift — dann messen die
      # Schrift-Tests überall 0 und schlagen fehl, ohne dass am Programm etwas falsch wäre.
      - name: fontconfig und eine Schrift installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfontconfig1 fonts-dejavu-core

      # Projektbezogen, nicht über die Solution: die enthält den WPF-Kopf.
      - name: Core bauen (Meilenstein M0)
        run: dotnet build src/GonkNote.Core/GonkNote.Core.csproj -c Release -warnaserror

      # Seit Phase 2 eine eigene Assembly. Sie zieht Core über eine ProjectReference mit,
      # steht hier aber trotzdem als eigener Schritt: schlägt sie fehl, soll die Meldung
      # „ViewModels" heißen und nicht „Core".
      - name: ViewModels bauen (Meilenstein M0)
        run: dotnet build src/GonkNote.ViewModels/GonkNote.ViewModels.csproj -c Release -warnaserror

      # Der Leser für Altdatenbanken (Phase 2, Schritt 3). Auch er gehört auf die Linux-Seite:
      # dort liegen Bestandsdaten, sobald der Avalonia-Kopf steht. Er zieht Core mit und
      # steht trotzdem als eigener Schritt, damit eine Meldung „Legacy" heißt und nicht „Core".
      - name: Legacy bauen (Leser fuer Altdatenbanken)
        run: dotnet build src/GonkNote.Legacy/GonkNote.Legacy.csproj -c Release -warnaserror

      # Der Linux-Kopf (Phase 3). **Hier ist dieser Lauf kein Frühwarnsystem mehr, sondern
      # der eigentliche Zweck:** GonkNote.Avalonia ist das erste Projekt, das unter Linux
      # nicht nur bauen, sondern laufen soll.
      #
      # Gebaut, nicht ausgeführt: eine Oberfläche braucht einen Bildschirm, und ein
      # xvfb-Lauf würde prüfen, ob Xvfb funktioniert, nicht ob die App etwas taugt. Was am
      # laufenden Programm zu prüfen ist, wird am laufenden Programm geprüft (HANDOFF
      # Dauerregel 4).
      - name: Avalonia-Kopf bauen (Meilenstein M1)
        run: dotnet build src/GonkNote.Avalonia/GonkNote.Avalonia.csproj -c Release -warnaserror

      # Siehe den gleichnamigen Schritt im Windows-Job: `tee` samt `pipefail`, damit der
      # Schritt darunter die gefallenen Waechter benennen kann.
      - name: Core-Tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/GonkNote.Core.Tests/GonkNote.Core.Tests.csproj \
            -c Release -warnaserror --logger "console;verbosity=normal" 2>&1 | tee test-output.txt

      # ------------------------------------------------------------------
      # Warum dieser Schritt existiert (§4.101, V2-125):
      #
      # Die CI war vier Tage lang rot, und **von außen war nicht zu erkennen, WAS fiel**.
      # Die Protokolle eines Laufs verlangen `admin`-Rechte am Repo
      # (`HTTP 403: Must have admin rights to Repository`) -- das gilt für den Lauf UND für
      # den einzelnen Job, und es gilt auch bei einem öffentlichen Repo. Wer nicht am Konto
      # sitzt, sieht nur „failure".
      #
      # `::error::` erzeugt dagegen eine **Annotation**, und die steht in der Check-Run-API,
      # die bei einem öffentlichen Repo **ohne Anmeldung** lesbar ist:
      #     /repos/:o/:r/check-runs/:id/annotations
      # Damit ist der Name des gefallenen Wächters von überall zu holen, ohne Zugangsdaten.
      #
      # ⚠ GitHub zeigt je Schritt **höchstens zehn** Fehler-Annotationen -- deshalb `head`.
      #   Die vollständige Liste geht zusätzlich in die Job-Zusammenfassung.
      # ------------------------------------------------------------------
      - name: Gefallene Waechter benennen
        if: failure()
        shell: bash
        run: |
          if [ ! -f test-output.txt ]; then
            echo "::error::Kein Testprotokoll -- der Lauf ist vor dem Testschritt gescheitert."
            exit 0
          fi

          # xUnit schreibt "[FAIL]", VSTest schreibt "  Failed <Name> [12 ms]".
          # Beide Formen einsammeln, damit die Zeile nicht an einer Werkzeugfassung haengt.
          grep -E '\[FAIL\]|^[[:space:]]*(Failed|Fehler)[[:space:]]+[A-Za-z]' test-output.txt \
            | sed 's/^[[:space:]]*//' | sort -u > gefallen.txt || true

          {
            echo "### Gefallene Waechter"
            echo ''
            echo '```'
            cat gefallen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Die letzten Zeilen sagen, wie viele es waren -- ohne sie liest man zehn Namen
          # und weiss nicht, ob es zehn oder hundert sind.
          grep -E 'Failed!|Passed!|Bestanden!|Fehlgeschlagen!' test-output.txt | tail -3 \
            | while IFS= read -r zeile; do echo "::error::$zeile"; done

          head -10 gefallen.txt | while IFS= read -r zeile; do echo "::error::$zeile"; done

      - name: Beweisstücke einsammeln
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: abweichungen-linux
          path: tests/GonkNote.Core.Tests/bin/Release/**/Snapshots/ist/**
          if-no-files-found: ignore
          retention-days: 14
