      Nicht als öffentliches Issue -- der Weg hier ist privat.
      Was hier als Lücke zählt, steht in SECURITY.md.
      · Not as a public issue; this route stays private.

  - name: Installieren & erste Schritte · Install and getting started
    url: https://github.com/GONKstupid/GonkNote/blob/main/Docs/ERSTE-SCHRITTE.md
    about: >
      Aufsetzen: Docs/INSTALLIEREN.md. Bedienung von der ersten Notiz bis zum Export
      und zur Sicherung: Docs/ERSTE-SCHRITTE.md.
      · English: Docs/INSTALL.md and Docs/GETTING-STARTED.md.
