# `blank_issues_enabled: true` -- bewusst. Ein leeres Issue ist besser als ein Bericht, den
# jemand wegen einer Vorlage nicht schreibt; die Vorlagen sind ein Angebot und keine Schranke.
blank_issues_enabled: true

contact_links:
